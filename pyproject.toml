[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fuzz-core"
version = "0.1.0"
description = "Merged FastAPI core for offline fuzz preparation and AFL++ job orchestration"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
  "PyYAML>=6.0",
  "python-multipart>=0.0.9"
]

[project.scripts]
fuzz-core = "fuzz_core.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["fuzz_core*"]
